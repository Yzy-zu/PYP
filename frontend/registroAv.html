<!DOCTYPE html>
<html lang="en-US">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>UTM</title>
         <link rel="icon" type="image/x-icon" href="../imagenes/verdes/favicon.ico" />
        <style>
            body{
                text-align: center;
            }
            form {
                display: inline-block;
                padding: 1em;
                border: 1px solid #ccc;
                border-radius: 1em;
            }

            p + p {
                margin-top: 1em;
            }

            label {
                display: inline-block;
                min-width: 90px;
                text-align: right;
            }

            input,
            textarea {
                font: 1em sans-serif;
                width: 300px;
                box-sizing: border-box;
                border: 1px solid #999;
            }

            input:focus,
            textarea:focus {
                outline-style: solid;
                outline-color: #000;
            }

            textarea {
                vertical-align: top;
                height: 5em;
            }

            .button {
                padding-left: 90px;
            }

            button {
                margin-left: 0.5em;
            }

            @media (max-width: 600px) {
                form {
                    width: 95%;
                    margin: 10px auto;
                }
                input, select, textarea {
                    width: 100%;
                    font-size: 16px; 
                }
                label {
                    display: block;
                    text-align: left;
                    margin-bottom: 5px;
                }
                .button {
                    padding-left: 0;
                }
                button {
                    width: 100%;
                    margin-left: 0;
                    padding: 10px;
                }
            }
        </style>
    </head>

    <body>
        <form id="formulario" action="/my-handling-form-page" method="post">
            <div class="logo-container"
                    style="display: flex; justify-content: space-between; align-items: center; padding: 0 20px;">
                    <img src="imagenes/utm_logo.svg" alt="Logo Escuela"
                        width="100">
                    <img src="imagenes/sys_logo.png" alt="Logo Escuela"
                        width="80">
                </div>
            <p>
                <label>Bienvenido al registro para probar nuestro sistema, ingresa tus datos para continuar</label>
            </p>
            <p>
                <label for="name">nombre:</label>
                <input type="text" id="name" name="user_name" required />
            </p>
            <p>
                <label for="mail">correo:</label>
                <input type="email" id="mail" name="user_mail" required />
            </p>
            <p>
                <label for="mi-pass">Contraseña:</label>
                <input type="password" id="pass" name="password" required>
            </p>
            <p>
                <label for="rfc">rfc:</label>
                <input type="text" id="rfc" name="rfc" maxlength="13" placeholder="13 caracteres" required />
            </p>
            <p>
                <label for="date">fecha nacimiento:</label>
                <input type="date" name="date" id="date" required />
            </p>
            <p>
                <label for="date">fecha de ingreso a labores:</label>
                <input type="date" name="date" id="date_ingreso" required/>
            </p>
            
            <p>
                <label for="categoria">carrera:</label>
                <select id="categoria" name="simple" required>
                    <option selected>Tecnologías de la Información</option> 
                    <option>Tecnologías de la Información</option>
                    <option>Gastronomía</option>
                    <option>Enfermería</option>
                    <option>Energías Renovables</option>
                    <option>Mantenimiento Industrial</option>
                    <option>Contabilidad</option>
                </select>
            </p>
            <p>
                <label for="tipo">categoria:</label>
                <select id="tipo" name="simple" required>
                    <option selected>Profesor de Asignatura</option> 
                    <option>Profesor de Tiempo Completo</option>
                    <option>Técnico Académico</option>
                </select>
            </p>
            <p>
                <label for="contrato">tipo contrato:</label>
                <select id="contrato" name="simple" required>
                    <option selected>Determinado</option> 
                    <option>Indeterminado</option>
                </select>
            </p>
            <p class="button">
                <button type="submit">REGISTRAR</button>
            </p>
            
        </form>
        <p class="button">
    <a href="registro.html">
        <button type="button">regresar</button>
    </a>
</p>
    <script src="js/registro.js"></script>
    </body>
</html>
